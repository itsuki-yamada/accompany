name: Release

# main にマージされるたびに、tarball と実行ファイルと npm のパッケージの形で E2E を通したうえで、
# 先行版 edge を作り直し、まだなければ package.json のバージョンの正式な Release を作り、npm にも公開する
on:
  push:
    branches:
      - main
  # 常に dry-run: タグも Release も作らずに、tarball・実行ファイル・E2E・「何をするか」の表示までを試す
  workflow_dispatch:

# main の実行は 1 本ずつ流し、edge の更新が競合しないようにする（待っている実行は最新のものだけが残る）。
# dry-run は何も書き込まないので、それぞれ独立に流す
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'publish' || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # main への push のときだけ。書き込み権限はこのジョブだけに渡す
  release:
    name: Release を作る
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: E2E を通した tarball を取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accompany-tarball
          path: tarball

      - name: E2E を通した実行ファイルを取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accompany-binaries
          path: binaries

      - name: edge を作り直し、まだなければ正式な Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: "false"
        run: .github/scripts/release.sh tarball/accompany-*.tgz binaries

  # Release を作ったあとに、同じ実行ファイルから npm のパッケージを作り、まだ公開していない版なら npm に公開する
  # （docs/adr/132-npm.md）。認証は npm の Trusted Publishing（OIDC）なので、id-token の権限をこのジョブだけに渡す
  npm:
    name: npm に公開する
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted Publishing には npm 11.5.1 以上が要る（Node 24 に同梱）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: E2E を通した実行ファイルを取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accompany-binaries
          path: binaries

      - name: npm のパッケージを作り、公開する前に npx で起動できることを確かめる
        run: |
          .github/scripts/build-npm-packages.sh binaries "$RUNNER_TEMP/npm-packages"
          .github/scripts/check-npm.sh "$RUNNER_TEMP/npm-packages" "$RUNNER_TEMP/npm-install"

      # 持ち主が npm 側の設定（最初の公開と Trusted Publishing）を終えて、リポジトリ変数 NPM_PUBLISH を true にするまでは、
      # パッケージを作って確かめるだけにする（毎回の失敗で Release のワークフローが赤にならないように）
      - name: npm に公開する
        if: vars.NPM_PUBLISH == 'true'
        env:
          DRY_RUN: "false"
        run: .github/scripts/publish-npm.sh "$RUNNER_TEMP/npm-packages"

  # main への push 以外（workflow_dispatch）では、読み取り権限だけで何をするかを表示する
  dry-run:
    name: Release を作らずに、何をするかを表示する
    needs: e2e
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: E2E を通した tarball を取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accompany-tarball
          path: tarball

      - name: E2E を通した実行ファイルを取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accompany-binaries
          path: binaries

      - name: 何をするかを表示する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: "true"
        run: .github/scripts/release.sh tarball/accompany-*.tgz binaries

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm のパッケージを作り、npx で起動できることを確かめ、何を公開するかを表示する
        env:
          DRY_RUN: "true"
        run: |
          .github/scripts/build-npm-packages.sh binaries "$RUNNER_TEMP/npm-packages"
          .github/scripts/check-npm.sh "$RUNNER_TEMP/npm-packages" "$RUNNER_TEMP/npm-install"
          .github/scripts/publish-npm.sh "$RUNNER_TEMP/npm-packages"
