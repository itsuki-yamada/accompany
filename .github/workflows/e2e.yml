name: E2E

on:
  pull_request:
  # release.yml から呼び出し、リリースする tarball を同じ手順で確かめる
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 止まったときに既定の 6 時間待たないようにする（ふだんは 4〜5 分。vscode のジョブは約 2 分）
    timeout-minutes: 20
    strategy:
      # 片方が落ちても、もう片方の結果とレポートを残す
      fail-fast: false
      matrix:
        # source: リポジトリから直接起動する / tarball: リリースする tarball から bunx で起動する /
        # binary: リリースする実行ファイル（linux-x64）を起動する /
        # npm: 公開する npm のパッケージを別のディレクトリに入れ、npx と起動役で起動する（docs/adr/132-npm.md）。
        # 起動役は Bun（mise.toml の版）で tarball の JS を動かす / npm-binary: 同じく入れ、Bun を使わずに実行ファイルを起動させる /
        # bun-min・bun-latest: Homebrew と同じく、tarball の JS を、対応する最も古い Bun と最新の Bun で動かす
        # （docs/adr/191-run-on-bun.md）。最新の Bun はいつ壊れるか分からず、Release を止めないよう、プルリクのときだけ流す
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["source","tarball","binary","npm","npm-binary","bun-min","bun-latest"]' || '["source","tarball","binary","npm","npm-binary","bun-min"]') }}
    steps:
      - uses: actions/checkout@v7.0.1

      # mise.toml の bun を使う
      - uses: jdx/mise-action@v5.2.4

      - name: 依存をインストールする
        run: |
          bun install --frozen-lockfile --cwd app/server
          bun install --frozen-lockfile --cwd e2e

      # tarball は、npm のパッケージ（同梱する JS）と Homebrew と同じ起動のしかたでも使うので、どの target でも作る。
      # bunx は tarball のパスごとにインストール先を使い回し、相対パスでは失敗するため、新しい絶対パスに置く
      - name: tarball を作る
        working-directory: app/server
        run: |
          tarball=$(bun pm pack --destination "$RUNNER_TEMP/tarball-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --quiet)
          echo "tarball: $tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: E2E の起動コマンドを tarball にする
        if: matrix.target == 'tarball'
        run: echo "ACCOMPANY_CMD=bunx --package $TARBALL accompany" >> "$GITHUB_ENV"

      # Homebrew の formula と同じく、tarball を展開し、その JS（dist/cli.js）を指定した版の Bun で動かす
      - name: E2E の起動コマンドを、tarball の JS を指定した版の Bun で動かすものにする
        if: matrix.target == 'bun-min' || matrix.target == 'bun-latest'
        env:
          # bun-min は、app/server/src/require-bun.ts の required と同じ版
          BUN_VERSION: ${{ matrix.target == 'bun-min' && '1.4.0' || 'latest' }}
        run: |
          dir="$RUNNER_TEMP/unpacked-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          mise install "bun@$BUN_VERSION"
          bun_path="$(mise where "bun@$BUN_VERSION")/bin/bun"
          echo "bun: $bun_path（$("$bun_path" --version)）"
          echo "ACCOMPANY_CMD=$bun_path $dir/package/dist/cli.js" >> "$GITHUB_ENV"
          echo "ACCOMPANY_EXPECT_RUNTIME=bun" >> "$GITHUB_ENV"

      # 4 つの OS と CPU 向けをすべてここでクロスコンパイルし、このランナーで動く linux-x64 で E2E を流す。
      # macOS 向けは、macOS のランナーの費用のため CI では流さない（docs/adr/78-binaries.md）
      - name: 実行ファイルを作り、E2E の起動コマンドを実行ファイルにする
        if: matrix.target == 'binary'
        run: |
          dir="$RUNNER_TEMP/binaries-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          .github/scripts/build-binaries.sh "$dir"
          binary=$(ls "$dir"/accompany-*-linux-x64)
          echo "binary: $binary"
          echo "ACCOMPANY_CMD=$binary" >> "$GITHUB_ENV"
          echo "ACCOMPANY_EXPECT_RUNTIME=binary" >> "$GITHUB_ENV"
          echo "BINARIES=$dir" >> "$GITHUB_ENV"

      # 公開する前のパッケージなので、レジストリの代わりに npm pack した tarball から入れる。
      # 実行ファイルは、ほかの OS と CPU のパッケージも作れることを確かめるため、4 つとも作る。
      # npx での起動と Ctrl+C は check-npm.sh で確かめ、E2E は入れた起動役（npm i -g で入るものと同じ）で流す。
      # npx を挟むと、Linux では npm が起動役を sh -c で起動し、npm だけに送った合図が起動役に届かない（docs/adr/132-npm.md）。
      # 起動役は、Bun があれば tarball の JS を Bun で動かす。E2E の中のコマンド（fixtures）も Bun で動かすので、Bun は
      # PATH から外せない。npm-binary では、ACCOMPANY_USE_BINARY=1 で実行ファイルを起動させる（docs/adr/191-run-on-bun.md）
      - name: npm のパッケージを作って別のディレクトリに入れ、E2E の起動コマンドを入れた起動役にする
        if: matrix.target == 'npm' || matrix.target == 'npm-binary'
        run: |
          dir="$RUNNER_TEMP/npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          .github/scripts/build-binaries.sh "$dir/binaries"
          .github/scripts/build-npm-packages.sh "$dir/binaries" "$TARBALL" "$dir/packages"
          .github/scripts/check-npm.sh "$dir/packages" "$dir/install"
          echo "ACCOMPANY_CMD=$dir/install/node_modules/.bin/accompany" >> "$GITHUB_ENV"
          if [ "${{ matrix.target }}" = npm-binary ]; then
            echo "ACCOMPANY_USE_BINARY=1" >> "$GITHUB_ENV"
            echo "ACCOMPANY_EXPECT_RUNTIME=binary" >> "$GITHUB_ENV"
          else
            echo "ACCOMPANY_EXPECT_RUNTIME=bun" >> "$GITHUB_ENV"
          fi

      # シェルの統合（accompany activate zsh）を本物の zsh で確かめるため（docs/adr/112-copy-last-output.md）
      - name: zsh を入れる
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Playwright の Chromium を入れる
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      # @wip は人間が main に積んだ実装前のテスト（docs/development-process.md）
      - name: E2E を実行する
        working-directory: e2e
        run: bun run test --grep-invert @wip

      # E2E を通した tarball そのものを、release.yml が Release に添付する
      - name: tarball をアップロードする
        if: matrix.target == 'tarball'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: accompany-tarball
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 30

      # E2E を通した実行ファイルそのものを、release.yml が Release に添付する。
      # 4 つで 300MB を超え、成果物の保存容量を圧迫するので、同じ実行の release.yml が取得できる 1 日だけ残す
      - name: 実行ファイルをアップロードする
        if: matrix.target == 'binary'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: accompany-binaries
          path: ${{ env.BINARIES }}/accompany-*
          if-no-files-found: error
          retention-days: 1

      # 失敗したときこそ証跡が必要なので、成否にかかわらずアップロードする
      - name: HTML レポートをアップロードする
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.target }}
          path: e2e/playwright-report/
          retention-days: 30

      - name: レポートへのリンクをサマリーに出す
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "## E2E の証跡（$TARGET）"
            echo
            echo "[Playwright の HTML レポート（スクリーンショット・動画・ログ）]($REPORT_URL)"
            echo
            echo "ダウンロードして展開し、\`bunx playwright show-report <展開先>\` で開く。"
          } >> "$GITHUB_STEP_SUMMARY"

  # VS Code の拡張（app/vscode）を作り、本物の VS Code に入れて確かめる（docs/adr/183-liveshare-extension.md）。
  # Live Share はサインインが要るので、同じ ID の偽物（e2e/fixtures/vscode/fake-liveshare）を入れる。
  # 拡張は試作で配布物に入らないので、プルリクのときだけ流し、release.yml から呼んだときは流さない（Release と npm の公開を止めない）
  vscode:
    name: e2e (vscode)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.4

      - name: 依存をインストールする
        run: |
          bun install --frozen-lockfile --cwd app/server
          bun install --frozen-lockfile --cwd app/vscode
          bun install --frozen-lockfile --cwd e2e

      # 同梱したコードに vsls の不要な依存が入っていないことも、ビルドの中で確かめる（app/vscode/scripts/check-bundle.ts）
      - name: 拡張を作り、vsix にまとめる
        working-directory: app/vscode
        run: bun run package

      # 利用者が手で試せるよう、作った vsix を上げる（Marketplace には公開しない）
      - name: vsix をアップロードする
        uses: actions/upload-artifact@v7.0.2
        with:
          name: accompany-vscode-vsix
          path: app/vscode/*.vsix
          if-no-files-found: error
          retention-days: 30

      # VS Code（Electron）が要るライブラリと、画面のない環境で動かすための Xvfb を入れる。
      # Chromium は、ほかの参加者としてブラウザで開くテストに使う
      - name: VS Code を動かすためのライブラリと Chromium を入れる
        working-directory: e2e
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb

      - name: E2E を実行する
        working-directory: e2e
        run: xvfb-run -a bun run test:vscode

      - name: HTML レポートをアップロードする
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-vscode
          path: e2e/playwright-report-vscode/
          retention-days: 30

      - name: レポートへのリンクをサマリーに出す
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## E2E の証跡（vscode）"
            echo
            echo "[Playwright の HTML レポート（スクリーンショット・ログ）]($REPORT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
