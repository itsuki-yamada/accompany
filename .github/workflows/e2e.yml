name: E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml の bun を使う
      - uses: jdx/mise-action@v5

      - name: 依存をインストールする
        run: |
          bun install --frozen-lockfile --cwd app/server
          bun install --frozen-lockfile --cwd e2e

      - name: Playwright の Chromium を入れる
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: E2E を実行する
        working-directory: e2e
        run: bun run test

      # 失敗したときこそ証跡が必要なので、成否にかかわらずアップロードする
      - name: HTML レポートをアップロードする
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: レポートへのリンクをサマリーに出す
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## E2E の証跡"
            echo
            echo "[Playwright の HTML レポート（スクリーンショット・動画・ログ）]($REPORT_URL)"
            echo
            echo "ダウンロードして展開し、\`bunx playwright show-report <展開先>\` で開く。"
          } >> "$GITHUB_STEP_SUMMARY"
